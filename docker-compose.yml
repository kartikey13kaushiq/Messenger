# `docker compose up --build` starts PostgreSQL and the app on http://localhost:8080.
# For development, run only the database (`docker compose up -d postgres`) and
# `./mvnw spring-boot:run -Dspring-boot.run.profiles=dev`.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: messenger
      POSTGRES_USER: messenger
      POSTGRES_PASSWORD: messenger
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messenger"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/messenger
      DATABASE_USERNAME: messenger
      DATABASE_PASSWORD: messenger
      JWT_SECRET: change-me-to-a-random-string-of-at-least-32-bytes
    ports: ["8080:8080"]

volumes:
  pgdata:
